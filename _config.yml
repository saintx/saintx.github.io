theme: jekyll-theme-chirpy

lang: en
timezone: America/New_York

title: Alexander Saint Croix
tagline: Notes on agents, context, and tools.
description: >-
  Notes on agents, context, and tools.

url: "https://saintx.dev"    # custom domain; no trailing slash
baseurl: ""                  # empty for a user site

github:
  username: saintx

social:
  name: Alexander Saint Croix
  links:
    - https://github.com/saintx

avatar: /assets/img/avatar.png

paginate: 10
toc: true

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - flake.nix
  - flake.lock
  - vendor
  - chirpy_defaults
  - Gemfile

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
